name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 8 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint
      - run: pnpm turbo typecheck
      - run: pnpm turbo test
      - run: pnpm turbo build
      - name: Check bundle size (all packages)
        run: pnpm exec size-limit
      # publint + attw inspect the packed tarball, so this must follow the build.
      - name: Check packaging (publint + attw)
        run: node scripts/check-packaging.mjs
      # A peer range that a core minor leaves turns every dependent into a 1.0.0
      # (#32). Fails on the feature PR and again on the release PR.
      - name: Check for unapproved major bumps
        run: node scripts/check-no-majors.mjs

  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 8 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @altara/core build
      - run: pnpm --filter @altara/storybook build-storybook
